<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@only.20sec | 실시간 살림 꿀템 모아보기</title>
  <!-- Tailwind CSS 및 FontAwesome 아이콘 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-16 min-h-screen">

  <!-- 상단 프로필 헤더 -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-[2px]">
          <div class="w-full h-full bg-white rounded-full flex items-center justify-center font-bold text-xs">
            20s
          </div>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight leading-tight">@only.20sec 꿀템 모음</h1>
          <p class="text-xs text-gray-500">인스타 피드 속 바로 그 제품 💡</p>
        </div>
      </div>
      <a href="https://instagram.com/only.20sec" target="_blank" class="text-xs font-semibold bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full text-gray-700 transition">
        인스타 가기
      </a>
    </div>

    <!-- 검색창 -->
    <div class="max-w-md mx-auto px-4 pb-3">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="찾으시는 살림템을 검색해보세요..." 
          class="w-full bg-gray-100 text-sm rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
      </div>
    </div>
  </header>

  <!-- 메인 상품 카드 리스트 -->
  <main class="max-w-md mx-auto px-4 pt-4">
    <div id="productGrid" class="grid grid-cols-2 gap-3">
      <!-- 자바스크립트로 자동 생성되는 영역 -->
    </div>
  </main>

  <!-- 공정위 필수 문구 푸터 -->
  <footer class="max-w-md mx-auto px-4 mt-12 text-center text-[11px] text-gray-400 space-y-1">
    <p>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    <p>© 2026 only.20sec. All rights reserved.</p>
  </footer>

  <script>
    // 기본 백업 데이터 (초기 등록 상품)
    const fallbackProducts = [
      {
        id: "1",
        title: "[특가] 매직캔 히포 냄새 완벽 차단 호환 리필팩",
        image_url: "https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?w=500&auto=format&fit=crop&q=80",
        affiliate_url: "https://link.coupang.com/re/AFFSDP?lptag=AF6754409&pageKey=8366355412"
      }
    ];

    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('./products.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error("JSON not found");
        const data = await res.json();
        allProducts = (data && data.length > 0) ? data : fallbackProducts;
      } catch (err) {
        console.log("products.json 로드 대기 중 - 기본 데이터 표시:", err);
        allProducts = fallbackProducts;
      }
      renderProducts(allProducts);
    }

    function renderProducts(items) {
      const container = document.getElementById('productGrid');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p class="col-span-2 text-center text-sm text-gray-400 py-8">등록된 상품이 없습니다.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition";
        card.innerHTML = `
          <div>
            <div class="w-full aspect-square bg-gray-100 overflow-hidden relative">
              <img src="${item.image_url}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/png?text=Product'">
              <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                피드 추천
              </span>
            </div>
            <div class="p-3">
              <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 leading-relaxed">
                ${item.title}
              </h3>
            </div>
          </div>
          <div class="p-3 pt-0">
            <a href="${item.affiliate_url}" target="_blank" 
               class="w-full block text-center py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm transition active:scale-95">
              최저가 보기 <i class="fa-solid fa-arrow-right ml-1"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    loadProducts();
  </script>
</body>
</html>
